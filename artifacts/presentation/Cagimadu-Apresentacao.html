<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f4fa">
  <title>Cagimadu — Do dado on-chain à decisão operacional</title>
  <style>
    :root{
      --bg:#f5f4fa;--paper:#fff;--ink:#16131d;--muted:#706b79;--faint:#95909f;
      --border:#dcd8e5;--violet:#7b3ff2;--violet2:#a87eff;--violet-pale:#efe8ff;
      --green:#00a47a;--green-pale:#e6f7f2;--orange:#c87919;--orange-pale:#fff1de;
      --red:#db4863;--red-pale:#fde9ed;--navy:#211833;--dark:#0e0b14;
      --sans:Inter,"Segoe UI",Arial,sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
    }
    *{box-sizing:border-box} html,body{height:100%;margin:0} body{overflow:hidden;background:#0a0810;color:var(--ink);font-family:var(--sans)}
    button{font:inherit} .deck{position:relative;width:100vw;height:100vh;display:grid;place-items:center}
    .slide{position:absolute;display:none;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:var(--bg);container-type:size}
    .slide.active{display:block;animation:enter .28s ease both}.slide.dark{background:var(--dark);color:white}
    @keyframes enter{from{opacity:.2;transform:translateX(1.2%)}to{opacity:1;transform:none}}
    .pad{position:absolute;inset:0;padding:5.2cqh 4.4cqw 6.4cqh}.topline{display:flex;align-items:center;justify-content:space-between;font:700 1.05cqw var(--mono);letter-spacing:.14em;color:var(--violet);text-transform:uppercase}
    .topline .num{color:var(--faint)} h1,h2,h3,p{margin:0}.title{margin-top:4.2cqh;font-size:4.1cqw;line-height:1.02;letter-spacing:-.045em;max-width:92%}.subtitle{margin-top:2.1cqh;max-width:88%;font-size:1.42cqw;line-height:1.35;color:var(--muted)}
    .footer{position:absolute;left:4.4cqw;right:4.4cqw;bottom:2.5cqh;border-top:1px solid var(--border);padding-top:1.15cqh;display:flex;justify-content:space-between;font:700 .62cqw var(--mono);letter-spacing:.11em;color:var(--faint)}
    .grid{display:grid}.cols2{grid-template-columns:1fr 1fr}.cols3{grid-template-columns:repeat(3,1fr)}.cols4{grid-template-columns:repeat(4,1fr)}.gap{gap:1.45cqw}.mt{margin-top:4.5cqh}.card{position:relative;background:var(--paper);border:1px solid var(--border);border-radius:.72cqw;padding:2.5cqh 1.55cqw;overflow:hidden}.card.dark{background:var(--navy);border-color:var(--navy);color:white}.card .eyebrow,.eyebrow{font:700 .78cqw var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--violet)}
    .card h3{margin-top:1.2cqh;font-size:1.65cqw;line-height:1.1}.card p{margin-top:1.3cqh;font-size:1.12cqw;line-height:1.35;color:var(--muted)}.card.dark p{color:#c9c0d3}.accent{border-left:.42cqw solid var(--violet)}
    .chip{display:inline-flex;align-items:center;justify-content:center;padding:.7cqh .72cqw;border-radius:.42cqw;background:var(--violet-pale);color:var(--violet);font:800 .72cqw var(--mono);letter-spacing:.08em;text-transform:uppercase}.chip.green{background:var(--green-pale);color:var(--green)}.chip.orange{background:var(--orange-pale);color:var(--orange)}.chip.red{background:var(--red-pale);color:var(--red)}
    .kpis{margin-top:4.3cqh}.kpi{min-height:14cqh;padding:2.1cqh 1.3cqw;border-left:.35cqw solid var(--violet)}.kpi strong{display:block;font:800 2.15cqw var(--mono);letter-spacing:-.05em}.kpi span{display:block;margin-top:.7cqh;font-size:1.02cqw;font-weight:700;color:var(--muted)}.kpi small{display:block;margin-top:.65cqh;font:.68cqw var(--mono);color:var(--faint)}
    .flow{display:grid;grid-template-columns:1fr .18fr 1fr .18fr 1fr .18fr 1fr .18fr 1fr;align-items:center;gap:.35cqw;margin-top:5.2cqh}.node{min-height:30cqh}.arrow{text-align:center;color:var(--violet);font-size:2cqw}.node .mini{margin-top:1cqh;font-size:.92cqw;line-height:1.35;color:var(--muted)}
    .metric{font:800 3.1cqw var(--mono);letter-spacing:-.06em}.quote{font-size:2cqw;line-height:1.15;font-weight:800}.muted{color:var(--muted)}.violet{color:var(--violet)}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.mono{font-family:var(--mono)}
    .rule{height:1px;background:var(--border)}.bullets{display:grid;gap:1.5cqh;margin-top:2.2cqh}.bullet{display:flex;gap:.72cqw;align-items:flex-start;font-size:1.05cqw;line-height:1.3}.bullet i{flex:0 0 auto;width:.55cqw;height:.55cqw;margin-top:.36cqh;border-radius:50%;background:var(--violet)}
    .brand{display:flex;align-items:center;gap:.8cqw;font-size:2cqw;font-weight:900;letter-spacing:-.04em}.mark{position:relative;width:2.25cqw;height:2.25cqw}.mark i{position:absolute;width:1cqw;height:1cqw;background:var(--violet2);box-shadow:0 .25cqw .8cqw #7b3ff245}.mark i:nth-child(1){left:0;top:.12cqw;transform:rotate(-3deg)}.mark i:nth-child(2){left:1.12cqw;top:0;background:var(--violet)}.mark i:nth-child(3){left:1.12cqw;top:1.12cqw}.brand b{color:var(--violet)}
    .cover{display:grid;grid-template-columns:62% 38%;height:100%}.cover-copy{padding:7.5cqh 5cqw}.cover-copy .over{margin-top:9cqh;font:800 .92cqw var(--mono);letter-spacing:.17em;color:var(--violet)}.cover h1{margin-top:3cqh;font-size:4.5cqw;line-height:1.02;letter-spacing:-.055em}.cover p{margin-top:3.5cqh;width:88%;font-size:1.55cqw;line-height:1.42;color:var(--muted)}.cover .chips{display:flex;gap:.75cqw;margin-top:4.5cqh}.cover-meta{position:absolute;bottom:7cqh;font-size:1cqw;color:var(--faint)}
    .art{position:relative;background:var(--dark);overflow:hidden}.art:before{content:"";position:absolute;inset:0;background:linear-gradient(#211a2c55 1px,transparent 1px),linear-gradient(90deg,#211a2c55 1px,transparent 1px);background-size:5.4cqw 5.4cqw}.hex{position:absolute;left:50%;top:46%;width:11cqw;height:11cqw;transform:translate(-50%,-50%) rotate(30deg);background:linear-gradient(145deg,var(--violet2),var(--violet));clip-path:polygon(25% 7%,75% 7%,100% 50%,75% 93%,25% 93%,0 50%);filter:drop-shadow(0 0 2cqw #7b3ff266)}.hex:after{content:"◆";position:absolute;inset:0;display:grid;place-items:center;transform:rotate(-30deg);color:white;font-size:4cqw}.orbit{position:absolute;left:50%;top:46%;border:1px solid #a87eff88;border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg)}.orbit.o1{width:25cqw;height:9cqw}.orbit.o2{width:18cqw;height:19cqw;transform:translate(-50%,-50%) rotate(58deg)}.live-label{position:absolute;left:0;right:0;bottom:16cqh;text-align:center;color:var(--green);font:800 1cqw var(--mono);letter-spacing:.28em}
    .timeline{position:relative;margin:8cqh 2cqw 0;height:29cqh}.timeline:before{content:"";position:absolute;left:0;right:0;top:7cqh;height:2px;background:var(--border)}.timepoints{display:grid;grid-template-columns:repeat(5,1fr);gap:1cqw}.point{text-align:center;position:relative}.dot{width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--violet);border:.22cqw solid white;margin:6.4cqh auto 2.3cqh;box-shadow:0 0 0 1px var(--border)}.point .lab{font:800 .72cqw var(--mono);letter-spacing:.12em;color:var(--violet)}.point strong{display:block;font:800 1.75cqw var(--mono)}.point small{display:block;margin-top:.8cqh;font-size:.82cqw;color:var(--muted)}
    .endpoint{display:grid;grid-template-columns:.7fr 3.6fr 1.7fr;align-items:center;padding:1.25cqh 1cqw}.endpoint code{font:800 1.02cqw var(--mono)}.endpoint em{text-align:right;font-style:normal;font-size:.9cqw;color:var(--muted)}.code{background:var(--dark);color:white;padding:3cqh 2cqw;border-radius:.7cqw;font:1.1cqw/1.55 var(--mono);white-space:pre}.code .v{color:#c8a9ff}.code .g{color:#8de4c7}
    .formula{text-align:center;padding:3.4cqh 2cqw}.formula strong{display:block;font:800 2.05cqw/1.5 var(--mono)}.formula small{font:1cqw var(--mono);color:var(--violet2)}
    .docrow{display:grid;grid-template-columns:.45fr 2.1fr 4.4fr;align-items:center;gap:1cqw;padding:1.8cqh 1.2cqw}.docrow>strong{font:800 .9cqw var(--mono);color:var(--violet)}.docrow h3{margin:0;font-size:1.42cqw}.docrow p{margin:0;font-size:.98cqw}.big33{display:grid;place-items:center;text-align:center}.big33 strong{font:800 4cqw var(--mono)}.big33 span{font-size:1.35cqw;font-weight:800}.big33 small{margin-top:2cqh;font:.78cqw var(--mono);color:var(--violet2)}
    .browser{position:absolute;left:15.2%;top:6.7%;width:82.5%;height:82.9%;background:white;border:1px solid #cfcad9;border-radius:.75cqw;overflow:hidden;box-shadow:0 1.2cqw 3.2cqw #3d33522b}.chrome{height:5.3%;background:#f2f0f6;display:flex;align-items:center;padding:0 1cqw;gap:.4cqw}.chrome i{width:.5cqw;height:.5cqw;border-radius:50%;background:var(--red)}.chrome i:nth-child(2){background:#e2a33a}.chrome i:nth-child(3){background:var(--green)}.chrome span{margin-left:.55cqw;font:.68cqw var(--mono);color:var(--muted)}.browser img{display:block;width:100%;height:94.7%;object-fit:fill}.product-panel{position:absolute;z-index:3;left:3.2%;top:14%;width:18.3%;height:66%;padding:4cqh 1.5cqw;border-radius:.75cqw;background:var(--navy);color:white;box-shadow:0 1cqw 2.2cqw #21183344}.product-panel.light{background:white;color:var(--ink);border:1px solid var(--border)}.product-panel .n{font:800 .82cqw var(--mono);color:var(--violet2)}.product-panel h2{margin-top:3cqh;font-size:2.45cqw;line-height:1.03}.product-panel p{margin-top:3cqh;font-size:1.05cqw;line-height:1.35;color:#c9c0d3}.product-panel.light p{color:var(--muted)}.product-panel ul{list-style:none;padding:0;margin:3.5cqh 0 0;display:grid;gap:1.25cqh}.product-panel li{font-size:.95cqw}.product-panel li:before{content:"•";color:var(--violet2);margin-right:.7cqw}.product-panel .chip{position:absolute;bottom:3.5cqh;left:1.5cqw}
    .road{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2cqw;margin-top:5cqh}.road .card{min-height:35cqh}.road h3{font-size:1.48cqw}.road .effort{display:block;margin-top:2cqh;font:800 .75cqw var(--mono);color:var(--violet)}
    .closing{margin-top:5cqh;background:var(--navy);color:white;border-radius:.65cqw;padding:2.7cqh 1.8cqw;display:grid;grid-template-columns:2.3fr 7fr;align-items:center;gap:2cqw}.closing strong{font-size:1.45cqw}.closing span{font-size:1.15cqw;color:#d7cfdf}
    .controls{position:fixed;z-index:50;left:50%;bottom:1.4rem;transform:translateX(-50%);display:flex;align-items:center;gap:.45rem;padding:.45rem;border:1px solid #ffffff25;border-radius:999px;background:#0e0b14d9;color:white;box-shadow:0 .5rem 1.5rem #0005;backdrop-filter:blur(12px);opacity:.2;transition:.2s}.controls:hover,.controls:focus-within{opacity:1}.controls button{width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:#ffffff12;color:white;cursor:pointer}.controls button:hover{background:#7b3ff2}.counter{min-width:4.4rem;text-align:center;font:.78rem var(--mono)}.progress{position:fixed;z-index:60;left:0;bottom:0;height:4px;background:var(--violet);transition:width .25s}.hint{position:fixed;right:1rem;top:1rem;z-index:60;color:#fff8;font:.7rem var(--mono)}
    @media(max-width:800px){.controls{opacity:.9}.hint{display:none}}
    @media(prefers-reduced-motion:reduce){.slide.active{animation:none}}
    @media print{@page{size:13.333in 7.5in;margin:0}html,body{height:auto;background:white;overflow:visible}.deck{display:block;width:auto;height:auto}.slide,.slide.active{position:relative;display:block;width:13.333in;height:7.5in;page-break-after:always;animation:none}.controls,.progress,.hint{display:none}}
  </style>
</head>
<body>
  <main class="deck" id="deck" aria-live="polite"></main>
  <div class="hint">← → navegar · F tela cheia · P PDF</div>
  <nav class="controls" aria-label="Controles da apresentação">
    <button id="prev" aria-label="Slide anterior">←</button><span class="counter" id="counter"></span><button id="next" aria-label="Próximo slide">→</button><button id="full" aria-label="Tela cheia">⛶</button>
  </nav>
  <div class="progress" id="progress"></div>
  <script>
    const foot=n=>`<div class="footer"><span>CAGIMADU / ETHEREUM FEE INTELLIGENCE</span><span>${String(n).padStart(2,'0')}</span></div>`;
    const head=(section,n,title,sub)=>`<div class="topline"><span>${section}</span><span class="num">${String(n).padStart(2,'0')}</span></div><h1 class="title">${title}</h1><p class="subtitle">${sub}</p>`;
    const dot=(text,color='')=>`<div class="bullet"><i style="${color?`background:${color}`:''}"></i><span>${text}</span></div>`;
    const slides=[
      `<section class="slide"><div class="cover"><div class="cover-copy"><div class="brand"><span class="mark"><i></i><i></i><i></i></span><span>cagimadu<b>.</b></span></div><div class="over">ETHEREUM FEE INTELLIGENCE</div><h1>Do dado on-chain<br>à decisão operacional.</h1><p>Monitoramento em tempo real de custos de taxa na Ethereum — um MVP construído para transformar telemetria bruta em ação.</p><div class="chips"><span class="chip green">MVP validado</span><span class="chip">Ethereum Mainnet</span><span class="chip">MIT</span></div><div class="cover-meta">Equipe Cagimadu · Inteli Blockchain · Parceiro Alphractal<br><span class="mono">03 SET 2026</span></div></div><div class="art"><div class="orbit o1"></div><div class="orbit o2"></div><div class="hex"></div><div class="live-label">LIVE · MAINNET · ~12s</div></div></div></section>`,
      `<section class="slide"><div class="pad">${head('Visão executiva',2,'O usuário não precisa de mais um dado.<br>Precisa saber o que fazer agora.','Cagimadu converte o estado bruto da rede Ethereum em uma leitura operacional: custo, pressão e momento de execução.')}<div class="grid cols3 gap mt"><article class="card accent"><span class="eyebrow">01 · observar</span><h3>Estado da rede</h3><p>Blocos, base fee, priority fee e ocupação chegam da Mainnet em ciclos próximos ao tempo de bloco.</p></article><article class="card accent" style="border-left-color:var(--green)"><span class="eyebrow green">02 · traduzir</span><h3>Regra de negócio</h3><p>A API normaliza os dados, calcula a fee recomendada e classifica a pressão da rede.</p></article><article class="card accent" style="border-left-color:var(--orange)"><span class="eyebrow orange">03 · decidir</span><h3>Ação operacional</h3><p>O painel estima o custo por operação e dá contexto para executar, aguardar ou monitorar.</p></article></div><div class="closing"><strong>Métrica norteadora</strong><span>decisões operacionais tomadas com confiança — não apenas visualizações consumidas.</span></div>${foot(2)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Negócio',3,'Médias históricas descrevem o passado.<br>A execução acontece no próximo bloco.','A EIP-1559 reprecifica a base fee bloco a bloco; a janela operacional muda em segundos, enquanto o custo do erro é assimétrico.')}<div class="timeline"><div class="timepoints">${[['MÉDIA','24h','suaviza o sinal'],['BLOCO','~12s','novo estado'],['PICO','+12,5%','ajuste possível'],['ORDEM','agora','decisão real'],['CUSTO','assimétrico','errar custa']].map((x,i)=>`<div class="point"><span class="lab">${x[0]}</span><div class="dot" style="background:${i===3?'var(--green)':i===4?'var(--red)':'var(--violet)'}"></div><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('')}</div></div><div class="closing"><strong>A pergunta muda</strong><span><s>“quanto custou?”</s> &nbsp;→&nbsp; <b>“quanto custa agora — e vale executar?”</b></span></div>${foot(3)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Negócio',4,'Mais densidade de valor para uma plataforma que já tem escala.','O módulo complementa a Alphractal: usa a cobertura existente e adiciona a camada operacional que ainda falta.')}<div class="grid cols4 gap kpis">${[['1.500+','métricas na plataforma','on-chain · macro · mercado','var(--violet)'],['1.000+','endpoints documentados','base pronta para integrar','var(--green)'],['1–5 min','cadência institucional','linha de base do produto','var(--orange)'],['~12 s','cadência do módulo','até 25× mais frequente','var(--violet2)']].map(x=>`<article class="card kpi" style="border-left-color:${x[3]}"><strong>${x[0]}</strong><span>${x[1]}</span><small>${x[2]}</small></article>`).join('')}</div><div class="grid cols2 gap mt"><article class="card"><span class="chip">já existe</span><h3 class="mono">FeeMean / FeeMed / FeeTot</h3><p>Agregados históricos, preço em moeda nativa e USD, alertas e dashboards.</p></article><article class="card dark"><span class="chip">Cagimadu adiciona</span><h3 class="mono">Fee recomendada + pressão + custo</h3><p>Uma leitura acionável do próximo movimento — pronta para alimentar o ecossistema de alertas existente.</p></article></div>${foot(4)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Produto',5,'Quatro capacidades, uma decisão mais clara.','O MVP organiza a complexidade da rede em camadas progressivas: ver, entender, estimar e agir.')}<div class="grid cols4 gap mt">${[['01','Explorar blocos','Fee, ocupação, transações, validador e pressão por bloco.','violet'],['02','Monitorar fees','Fee recomendada, decomposição e histórico recente.','green'],['03','Simular operações','Custo estimado de transferência, swap e mint de NFT.','orange'],['04','Contextualizar','Sinais de rede traduzidos em linguagem operacional.','violet']].map((x,i)=>`<article class="card ${i===3?'dark':''}"><span class="eyebrow ${x[3]}">${x[0]}</span><div class="metric ${x[3]}" style="margin-top:3cqh">${['⬡','⌁','ϟ','◆'][i]}</div><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div>${foot(5)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Arquitetura',6,'Da Mainnet ao insight, com contratos claros entre as camadas.','A separação em serviços, controllers e cliente HTTP mantém a regra de negócio fora da interface e facilita a evolução.')}<div class="flow">${[['fonte','Ethereum Mainnet','Blocos + eth_feeHistory via JSON-RPC','dark'],['acesso','Viem service','Consulta, normalização, cálculos e amostragem',''],['proteção','Cache resiliente','TTL + deduplicação + último valor válido',''],['contrato','API REST','Zod → controller → { data, meta }',''],['experiência','React + D3','Blocos, Fees e Mercado','dark']].map((x,i)=>`${i?'<div class="arrow">→</div>':''}<article class="card node ${x[3]}"><span class="eyebrow">${x[0]}</span><h3>${x[1]}</h3><p class="mini">${x[2]}</p></article>`).join('')}</div><div class="closing"><strong>Feedback operacional</strong><span>Atualização periódica · estado de cache visível · fallback identificado · erros estruturados</span></div>${foot(6)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Engenharia',7,'Escolhas enxutas para entregar rápido — sem perder separação.','TypeScript atravessa todo o produto; cada tecnologia tem um papel simples, conhecido e substituível.')}<div class="grid cols4 gap mt">${[['FRONTEND',['React','Vite','TypeScript','D3'],'violet'],['BACKEND',['Node.js','Express','TypeScript','Viem'],'green'],['QUALIDADE',['Zod','Vitest','Supertest','ESLint'],'orange'],['OPERAÇÃO',['Render','PublicNode','Cache RAM','MIT'],'violet']].map(x=>`<article class="card"><span class="eyebrow ${x[2]}">${x[0]}</span><div class="bullets">${x[1].map(v=>dot(v)).join('')}</div></article>`).join('')}</div><div class="closing"><strong>Princípio</strong><span>Trocar provider, rede ou camada de entrega sem reescrever a experiência.</span></div>${foot(7)}</div></section>`,
      `<section class="slide"><div class="pad">${head('API',8,'Quatro endpoints para ler blocos e custos de execução.','Validação via Zod, respostas consistentes e metadados que tornam cache e obsolescência observáveis.')}<div class="grid cols2 gap mt"><div class="grid" style="gap:1.2cqh">${[['/api/blocks?limit=40','blocos recentes'],['/api/blocks/:number','detalhe do bloco'],['/api/fees/current','fee recomendada agora'],['/api/fees/history?blocks=300','série histórica']].map((x,i)=>`<article class="card endpoint"><span class="chip ${i===2?'green':i===3?'orange':''}">GET</span><code>${x[0]}</code><em>${x[1]}</em></article>`).join('')}</div><div class="code"><span class="v">{</span>\n  <span class="v">"data"</span>: { ... },\n  <span class="g">"meta"</span>: {\n    "source": "ethereum-rpc",\n    "cached": false,\n    "stale": false,\n    "updatedAt": "..."\n  }\n<span class="v">}</span></div></div>${foot(8)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Regras de negócio',9,'Cálculos simples, transparentes e auditáveis.','O valor do módulo está menos em “prever” e mais em tornar explícito como cada número vira uma decisão.')}<div class="grid" style="grid-template-columns:1.1fr 1fr 1fr;gap:1.45cqw;margin-top:4.5cqh"><article class="card dark formula"><span class="chip">fee recomendada</span><strong>base fee<br>+<br>priority fee p50</strong><small>resultado em Gwei</small></article><div class="grid" style="gap:1.45cqh"><article class="card"><span class="eyebrow">Custo da operação</span><h3 class="mono violet">fee × gas × 10⁻⁹</h3><p>resultado em ETH</p></article><article class="card"><span class="eyebrow green">Pressão da rede</span><h3 class="mono green">ocupação + fee</h3><p>Baixa · Moderada · Alta · Crítica</p></article></div><article class="card"><span class="eyebrow">Exemplo real</span><div class="bullets mono">${['Fee — 0,2040 Gwei','Transferência — 0,00000428 ETH','Swap — 0,00003060 ETH','Mint NFT — 0,00002040 ETH'].map(v=>dot(v)).join('')}</div><span class="chip green" style="margin-top:2.5cqh">aritmética validada</span></article></div>${foot(9)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Confiabilidade',10,'Falhar com contexto é melhor do que falhar em silêncio.','A experiência distingue dados frescos, cacheados, obsoletos e demonstrativos — mantendo transparência com o usuário.')}<div class="flow" style="grid-template-columns:1fr .18fr 1fr .18fr 1fr .18fr 1.35fr">${[['entrada','Requisição','Frontend pede blocos ou fees',''],['decisão','Cache','Fresco? responde. Em voo? compartilha',''],['origem','Provider RPC','Consulta a Mainnet com timeout',''],['saída','Resposta consciente','fresh → cached → stale → demo identificado','dark']].map((x,i)=>`${i?'<div class="arrow">→</div>':''}<article class="card node ${x[3]}"><span class="eyebrow">${x[0]}</span><h3>${x[1]}</h3><p class="mini">${x[2]}</p></article>`).join('')}</div><div class="grid cols4 gap mt">${[['TTL','10–12 s',''],['DEDUP','1 consulta concorrente','green'],['STALE','último valor válido','orange'],['ERROR','contrato estruturado','red']].map(x=>`<div class="chip ${x[2]}" style="padding:1.5cqh 1cqw">${x[0]} · ${x[1]}</div>`).join('')}</div>${foot(10)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Documentação',11,'O código entrega o MVP. A documentação reduz o custo da próxima decisão.','Negócio, arquitetura, validação e rastreabilidade formam um conjunto conectado — não anexos isolados.')}<div class="grid" style="grid-template-columns:2.3fr .95fr;gap:1.45cqw;margin-top:4.2cqh"><div class="grid" style="gap:1.3cqh">${[['01','Análise de negócios','Mercado, personas, proposta de valor, canvas, SWOT, KPIs, riscos e viabilidade.'],['02','Documentação técnica','Arquitetura, camadas, regras, contratos, cache, frontend e pontos de extensão.'],['03','Validação técnica','Build, lint, testes, endpoints reais, cálculos independentes e lacunas do TAP.']].map(x=>`<article class="card docrow"><strong>${x[0]}</strong><h3>${x[1]}</h3><p>${x[2]}</p></article>`).join('')}</div><article class="card dark big33"><strong>33</strong><span>cláusulas do TAP<br>mapeadas até a evidência</span><small>decisão → requisito → código → teste</small></article></div>${foot(11)}</div></section>`,
      `<section class="slide"><div class="pad">${head('Evidências',12,'Funciona, calcula corretamente e degrada com transparência.','Execução real contra a Ethereum Mainnet em 01/09/2026, complementada por testes automatizados e inspeção arquitetural.')}<div class="grid cols4 gap kpis">${[['11 / 11','testes automatizados','Vitest + Supertest','var(--green)'],['4','endpoints de dados','todos exercitados','var(--violet)'],['79 kB','bundle JS gzip','React + D3','var(--orange)'],['R$ 0','infra do MVP','plano gratuito','var(--violet2)']].map(x=>`<article class="card kpi" style="border-left-color:${x[3]}"><strong>${x[0]}</strong><span>${x[1]}</span><small>${x[2]}</small></article>`).join('')}</div><div class="grid cols2 gap mt"><article class="card"><h3>O que foi comprovado</h3><div class="bullets">${['build e lint sem erros','dados reais da Mainnet','cálculos conferidos independentemente','cache, stale e erros estruturados'].map(v=>dot(v,'var(--green)')).join('')}</div></article><article class="card" style="background:var(--orange-pale);border-color:var(--orange-pale)"><h3>Pronto para produção?</h3><p class="orange"><b>Ainda não — e isso está documentado.</b></p><p>Faltam versões fixadas, rate limit, observabilidade, USD e streaming.</p></article></div>${foot(12)}</div></section>`,
      `<section class="slide"><div class="browser"><div class="chrome"><i></i><i></i><i></i><span>cagimadu / blocos</span></div><img src="screenshots/blocos-live.png" alt="Tela real do explorador de blocos"></div><aside class="product-panel"><span class="n">01</span><h2>Explorador<br>de blocos</h2><p>Uma visão operacional do que acabou de acontecer na rede.</p><ul><li>fee por bloco</li><li>ocupação e pressão</li><li>transações e validador</li><li>atualização ao vivo</li></ul><span class="chip green">Mainnet real</span></aside>${foot(13)}</section>`,
      `<section class="slide"><div class="browser"><div class="chrome"><i></i><i></i><i></i><span>cagimadu / fees</span></div><img src="screenshots/fees-live.png" alt="Tela real do monitor de fees"></div><aside class="product-panel"><span class="n green">02</span><h2>Fee<br>monitor</h2><p>Do número isolado à decisão de custo por operação.</p><ul><li>fee recomendada</li><li>histórico de 300 blocos</li><li>volatilidade visível</li><li>estimativa por operação</li></ul><span class="chip green">Mainnet real</span></aside>${foot(14)}</section>`,
      `<section class="slide"><div class="browser"><div class="chrome"><i></i><i></i><i></i><span>cagimadu / análise de mercado</span></div><img src="screenshots/mercado.png" alt="Direção visual da tela de mercado"></div><aside class="product-panel light"><span class="n orange">03</span><h2>Contexto<br>de mercado</h2><p>A linguagem visual antecipa como fees podem conversar com inteligência de mercado.</p><ul><li>brief editorial</li><li>snapshot de rede</li><li>fee pulse</li><li>insight acionável</li></ul><span class="chip orange">dados demonstrativos</span></aside>${foot(15)}</section>`,
      `<section class="slide"><div class="pad">${head('Próximos passos',16,'A próxima versão deve capturar valor antes de adicionar complexidade.','O roadmap prioriza ganhos quase gratuitos, depois compatibilidade comercial e, por fim, a arquitetura de streaming prevista no TAP.')}<div class="road">${[['01','Fixar versões','minutos','build reproduzível'],['02','Próximo bloco','≈ zero esforço','usar base fee já recebida'],['03','Conversão USD','baixo esforço','seguir padrão Alphractal'],['04','SSE','médio esforço','entrega contínua de fees'],['05','WebSocket','alto impacto','ingestão eficiente + escala']].map((x,i)=>`<article class="card ${i===4?'dark':''}"><span class="eyebrow">${x[0]}</span><h3>${x[1]}</h3><span class="effort">${x[2]}</span><p>${x[3]}</p></article>`).join('')}</div><div class="closing"><strong>Já provamos que funciona.</strong><span>Agora o foco é encaixar no ecossistema da Alphractal e transformar telemetria em hábito operacional.</span></div>${foot(16)}</div></section>`
    ];
    const deck=document.querySelector('#deck');deck.innerHTML=slides.join('');const els=[...document.querySelectorAll('.slide')];let current=Math.max(0,Math.min(els.length-1,(parseInt(location.hash.slice(1))||1)-1));
    function show(i){current=(i+els.length)%els.length;els.forEach((s,n)=>s.classList.toggle('active',n===current));counter.textContent=`${String(current+1).padStart(2,'0')} / ${els.length}`;progress.style.width=`${(current+1)/els.length*100}%`;history.replaceState(null,'',`#${current+1}`)}
    const next=()=>show(current+1),prev=()=>show(current-1);document.querySelector('#next').onclick=next;document.querySelector('#prev').onclick=prev;document.querySelector('#full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next()}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev()}if(e.key.toLowerCase()==='f')document.querySelector('#full').click();if(e.key.toLowerCase()==='p')print();if(e.key==='Home')show(0);if(e.key==='End')show(els.length-1)});
    let sx=0;addEventListener('touchstart',e=>sx=e.changedTouches[0].screenX,{passive:true});addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx;if(Math.abs(dx)>45)(dx<0?next:prev)()},{passive:true});show(current);
  </script>
